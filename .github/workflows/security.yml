name: IaC Security & Cost

on: [pull_request, push]

permissions:
  contents: read

env:
  CONFTEST_VERSION: 0.69.0

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      # examples/ holds policy fixtures, and half of them are deliberately
      # insecure, so tfsec and Checkov report on them without failing the build.
      # The OPA gate below is what decides pass/fail.
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: examples
          soft_fail: true

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: examples
          soft_fail: true

      # instrumenta/conftest-action is unmaintained (last release 2021) and has
      # no v0.3 tag, which failed the job before any step ran. Pin the binary.
      - name: Install conftest
        run: |
          curl -sSfL \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
          conftest --version

      - name: Policy unit tests
        run: conftest verify --policy policies/opa

      # A policy gate that only ever sees compliant input proves nothing, so
      # assert both directions: the bad fixtures must be rejected and the good
      # ones must pass.
      - name: Non-compliant fixtures must be rejected
        run: |
          status=0
          for fixture in examples/aws/public-s3 examples/azure/public-blob; do
            if conftest test --policy policies/opa "$fixture"; then
              echo "::error file=$fixture/main.tf::$fixture was accepted but must be rejected"
              status=1
            else
              echo "$fixture correctly rejected"
            fi
          done
          exit $status

      - name: Compliant fixtures must pass
        run: conftest test --policy policies/opa examples/aws/secure-s3 examples/azure/secure-blob

      - name: Infracost setup
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}

      - name: Infracost diff
        if: env.INFRACOST_API_KEY != ''
        run: infracost breakdown --path examples --format json --out-file infracost.json || true
